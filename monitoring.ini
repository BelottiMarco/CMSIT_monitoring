# Shared configuration for the monitoring pipeline:
#   log_to_csv.py  -> csv_chunker.py -> exporter.py
#
# Any value here can still be overridden with the matching --flag on the
# command line for a one-off run without editing this file.
#
# To use a different config file (e.g. a second, independent monitoring
# setup), pass --config /path/to/other.ini to any of the three scripts,
# or set the MONITORING_CONFIG environment variable.

[paths]
# Root of the Ph2_ACF installation (contains settings/ and test/)
ph2_acf_dir    = /home/bootcamp/marco/Ph2_ACF_1/Ph2_ACF/

# Base directory everything else in this file is derived from:
#   output_csv_dir/<output_csv_name>   <- log_to_csv.py writes here
#   output_csv_dir/chunks              <- csv_chunker.py writes here, exporter.py reads here
output_csv_dir = /home/bootcamp/marco/code/MonitoringCSV

[log_to_csv]
xml_file          = CMSIT_gtx0.xml
calibration       = physics
output_csv_name   = monitoring_FULL.csv
timeout           = 300
heartbeat_seconds = 120
log_time          = false
terminal_ph2_acf  = false
no_launch         = false

[csv_chunker]
max_mb    = 0.01
# Relative to [paths] output_csv_dir, same as output_csv_name above
debug_csv = monitoring_DEBUG.csv

[exporter]
stale_after = 150
