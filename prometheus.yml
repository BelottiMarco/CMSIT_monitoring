global:
  scrape_interval: 1s
  evaluation_interval: 1s
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "csv_exporter"
    scrape_interval: 1s
    static_configs:
      - targets: ["127.0.0.1:8000"]

